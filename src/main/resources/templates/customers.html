<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{base :: head('Customers - Sentinel')}"></head>
<body>
    <div th:replace="~{base :: navbar}"></div>
    
    <div class="container">
        <h1>Customers</h1>
        <p style="color: #94a3b8; margin-bottom: 2rem;">Showing all registered customers.</p>
        
        <div class="card">
            <div th:if="${#lists.isEmpty(customers)}">No customers found.</div>
            <table th:unless="${#lists.isEmpty(customers)}">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Risk Rating</th>
                        <th>KYC Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="customer : ${customers}">
                        <td th:text="${customer.id()}">ID</td>
                        <td th:text="${customer.name()}">Name</td>
                        <td>
                            <span th:class="${customer.riskRating() == 'HIGH' ? 'badge-danger' : (customer.riskRating() == 'MEDIUM' ? 'badge-warning' : '')}"
                                  th:style="${customer.riskRating() == 'LOW' ? 'background-color: rgba(16, 185, 129, 0.2); color: #10b981; padding: 0.25rem 0.5rem; border-radius: 9999px; font-size: 0.875rem; font-weight: 600;' : ''}"
                                  th:text="${customer.riskRating()}">Rating</span>
                        </td>
                        <td th:text="${customer.kycStatus()}">Status</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
