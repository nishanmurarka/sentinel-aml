<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Generate SAR Draft</title>
    <th:block th:replace="~{base :: head('SAR Draft')}"></th:block>
    <style>
        .sar-container {
            margin-top: 2rem;
        }
        .textarea-container {
            width: 100%;
            margin-bottom: 1rem;
        }
        textarea {
            width: 100%;
            height: 400px;
            padding: 1rem;
            font-family: monospace;
            font-size: 0.9rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: #f8fafc;
            color: #334155;
            resize: vertical;
        }
        .actions {
            display: flex;
            gap: 1rem;
        }
        .btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
        }
        .btn-primary {
            background-color: var(--primary);
            color: white;
        }
        .btn-secondary {
            background-color: #e2e8f0;
            color: #475569;
        }
    </style>
</head>
<body>
    <div th:replace="~{base :: navbar}"></div>

    <div class="container sar-container">
        <h2>Suspicious Activity Report Draft</h2>
        <p style="color: #64748b; margin-bottom: 1.5rem;">Review the automatically generated narrative for Alert <span th:text="${alertId}"></span> before regulatory filing.</p>
        
        <div class="card">
            <div class="textarea-container">
                <textarea id="sarDraftText" readonly th:text="${sarDraft}"></textarea>
            </div>
            <div class="actions">
                <button class="btn btn-primary" onclick="copyToClipboard()">Copy to Clipboard</button>
                <a href="/alerts" class="btn btn-secondary">Back to Alerts</a>
            </div>
        </div>
    </div>

    <script>
        function copyToClipboard() {
            var copyText = document.getElementById("sarDraftText");
            copyText.select();
            copyText.setSelectionRange(0, 99999); /* For mobile devices */
            navigator.clipboard.writeText(copyText.value).then(function() {
                alert("Copied SAR draft to clipboard!");
            }, function(err) {
                console.error('Could not copy text: ', err);
            });
        }
    </script>
</body>
</html>
