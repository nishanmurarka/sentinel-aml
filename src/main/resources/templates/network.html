<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Network Graph</title>
    <th:block th:replace="~{base :: head('Network Visualization')}"></th:block>
    <!-- Include Vis.js -->
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        #mynetwork {
            width: 100%;
            height: 700px;
            border: 1px solid var(--border-color);
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div th:replace="~{base :: navbar}"></div>

    <div class="container">
        <div class="header-section">
            <h2>Account Transaction Network</h2>
            <button onclick="fetchNetworkData()" style="padding: 0.5rem 1rem; background-color: var(--primary); color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 600;">Refresh Graph</button>
        </div>
        <p style="color: #64748b; margin-bottom: 1rem;">Visualizing transaction flows between accounts to detect layering or shell companies.</p>
        <div id="mynetwork"></div>
    </div>

    <script type="text/javascript">
        let network = null;

        function fetchNetworkData() {
            fetch('/api/network/data')
                .then(response => response.json())
                .then(data => {
                    drawNetwork(data.nodes, data.edges);
                })
                .catch(error => {
                    console.error('Error fetching network data:', error);
                    alert('Failed to load network data.');
                });
        }

        function drawNetwork(nodesData, edgesData) {
            const container = document.getElementById('mynetwork');
            
            // Format nodes for Vis.js
            const nodes = new vis.DataSet(nodesData.map(node => ({
                id: node.id,
                label: node.label,
                group: node.group,
                shape: 'dot',
                size: 20,
                font: { size: 14, color: '#16303D' }
            })));

            // Format edges for Vis.js
            const edges = new vis.DataSet(edgesData.map(edge => ({
                from: edge.from,
                to: edge.to,
                label: edge.label,
                arrows: 'to',
                font: { align: 'middle', size: 10, color: '#64748b' },
                color: { color: '#94a3b8', highlight: '#00c269' },
                width: 2
            })));

            const data = { nodes: nodes, edges: edges };
            
            const options = {
                nodes: {
                    color: {
                        background: '#e2e8f0',
                        border: '#94a3b8',
                        highlight: { background: '#00c269', border: '#00c269' }
                    }
                },
                physics: {
                    stabilization: true,
                    barnesHut: {
                        gravitationalConstant: -2000,
                        springConstant: 0.04,
                        springLength: 95
                    }
                },
                interaction: {
                    hover: true,
                    tooltipDelay: 200
                }
            };

            if (network !== null) {
                network.destroy();
                network = null;
            }

            network = new vis.Network(container, data, options);
        }

        // Initialize on load
        document.addEventListener('DOMContentLoaded', fetchNetworkData);
    </script>
</body>
</html>
